version: '3.8'

services:
  postgres:
    container_name: postgres-sql-century
    image: postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: db_immo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - spring-demo
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - spring-demo

  # century-backend:
  #   container_name: century-backend
  #   image: openjdk:17-alpine
  #   volumes:
  #     - ./century-backend:/app
  #   working_dir: /app
  #   command: ["java", "-jar", "target/century-backend.jar"]
  #   ports:
  #     - 8084:8084
  #   networks:
  #     - spring-demo
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

networks:
  spring-demo:
    driver: bridge

volumes:
  postgres-data:
    driver: local
